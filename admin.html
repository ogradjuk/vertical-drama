<body class="bg-dark-900 text-gray-100 flex flex-col min-h-screen p-0">

    <!-- DESKTOP TOP BAR: MODE SWITCHER (MOBILE / ADMIN) -->
    <header class="w-full bg-dark-800 border-b border-dark-700/80 px-4 py-2.5 flex items-center justify-between z-50 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-gold-500 to-bronze-500 flex items-center justify-center text-dark-900 font-black text-xs shadow-md shadow-gold-500/20">
                9:16
            </div>
            <span class="font-bold text-sm tracking-wide text-white">CineVertical <span class="text-xs text-gold-400 font-normal ml-1">CMS & App Platform</span></span>
        </div>

        <div class="flex items-center space-x-2 bg-dark-900/90 p-1 rounded-2xl border border-dark-700">
            <button id="view-mode-app-btn" onclick="togglePlatformView('app')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-2 bg-gold-500 text-dark-900 shadow-md">
                <i class="fa-solid fa-mobile-screen"></i>
                <span class="hidden sm:inline">Мобильное приложение</span>
            </button>
            <button id="view-mode-admin-btn" onclick="togglePlatformView('admin')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-2 text-gray-400 hover:text-white">
                <i class="fa-solid fa-sliders"></i>
                <span class="hidden sm:inline">Панель администратора</span>
            </button>
        </div>
    </header>

    <!-- MAIN WRAPPER CONTAINER -->
    <main class="flex-1 flex justify-center items-center relative overflow-hidden w-full py-0 sm:py-4">

        <!-- 1. MOBILE PHONE APP VIEW CONTAINER -->
        <div id="app-container" class="w-full sm:w-[412px] h-[100vh] sm:h-[860px] bg-dark-900 sm:rounded-[40px] sm:border-[8px] sm:border-dark-700 shadow-2xl flex flex-col relative overflow-hidden transition-all duration-300">

            <!-- MAIN VIEWPORT CONTENT -->
            <div id="view-content" class="flex-1 overflow-y-auto no-scrollbar relative flex flex-col pb-20">
                <!-- Dynamically injected views go here -->
            </div>

            <!-- NOTIFICATION / TOAST BOX -->
            <div id="toast-box" class="absolute top-6 left-1/2 transform -translate-x-1/2 bg-dark-700 text-gold-400 px-4 py-2 rounded-2xl text-sm font-medium border border-gold-500/30 shadow-xl opacity-0 transition-opacity duration-300 pointer-events-none z-50 flex items-center space-x-2">
                <i class="fa-solid fa-circle-check"></i>
                <span id="toast-text">Успешно</span>
            </div>

            <!-- BOTTOM NAVIGATION BAR -->
            <nav id="bottom-nav" class="absolute bottom-0 left-0 right-0 h-16 glass border-t border-dark-700/80 flex justify-around items-center px-2 z-40">
                <button onclick="switchTab('catalog')" id="nav-catalog" class="flex flex-col items-center justify-center w-full py-1 text-gold-500 transition">
                    <i class="fa-solid fa-film text-lg mb-0.5"></i>
                    <span class="text-[10px] font-medium">Каталог</span>
                </button>
                <button onclick="switchTab('search')" id="nav-search" class="flex flex-col items-center justify-center w-full py-1 text-gray-400 hover:text-gray-200 transition">
                    <i class="fa-solid fa-magnifying-glass text-lg mb-0.5"></i>
                    <span class="text-[10px] font-medium">Поиск</span>
                </button>
                <button onclick="switchTab('favorites')" id="nav-favorites" class="flex flex-col items-center justify-center w-full py-1 text-gray-400 hover:text-gray-200 transition">
                    <i class="fa-solid fa-bookmark text-lg mb-0.5"></i>
                    <span class="text-[10px] font-medium">Избранное</span>
                </button>
                <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center justify-center w-full py-1 text-gray-400 hover:text-gray-200 transition">
                    <i class="fa-solid fa-user text-lg mb-0.5"></i>
                    <span class="text-[10px] font-medium">Профиль</span>
                </button>
            </nav>

            <!-- FULLSCREEN VIDEO PLAYER OVERLAY -->
            <div id="video-player-modal" class="absolute inset-0 bg-black z-50 hidden flex flex-col justify-between">
                <div class="absolute inset-0 w-full h-full overflow-hidden flex items-center justify-center bg-dark-900">
                    <video id="active-video-element" class="w-full h-full object-cover" loop playsinline autoplay>
                        <source src="https://assets.mixkit.co/videos/preview/mixkit-woman-running-in-front-of-neon-lights-42867-large.mp4" type="video/mp4">
                    </video>
                    <div class="absolute inset-x-0 top-0 h-32 bg-gradient-to-b from-black/80 to-transparent pointer-events-none"></div>
                    <div class="absolute inset-x-0 bottom-0 h-48 bg-gradient-to-t from-black/90 to-transparent pointer-events-none"></div>
                </div>

                <div class="relative z-10 flex items-center justify-between p-4 pt-6">
                    <button onclick="closeVideoPlayer()" class="w-10 h-10 rounded-full bg-black/40 backdrop-blur flex items-center justify-center text-white text-lg border border-white/10 active:scale-95 transition">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <div class="text-center">
                        <h3 id="player-series-title" class="text-sm font-bold text-white line-clamp-1">Название сериала</h3>
                        <p id="player-episode-subtitle" class="text-xs text-gold-400 font-medium">Серия 1</p>
                    </div>
                    <button onclick="togglePlayerLike()" class="w-10 h-10 rounded-full bg-black/40 backdrop-blur flex items-center justify-center text-white text-lg border border-white/10 active:scale-95 transition">
                        <i id="player-like-icon" class="fa-regular fa-bookmark text-gold-400"></i>
                    </button>
                </div>

                <div onclick="togglePlayPause()" class="absolute inset-0 z-0 flex items-center justify-center">
                    <div id="play-pause-indicator" class="w-16 h-16 rounded-full bg-black/50 backdrop-blur flex items-center justify-center text-white text-2xl opacity-0 transition-opacity duration-300">
                        <i id="play-pause-icon" class="fa-solid fa-play"></i>
                    </div>
                </div>

                <div class="relative z-10 p-4 pb-8 flex flex-col space-y-3">
                    <div class="flex items-center space-x-2 overflow-x-auto no-scrollbar py-1" id="player-episodes-strip"></div>
                    <div class="flex items-center justify-between text-xs text-gray-300">
                        <div class="flex items-center space-x-3">
                            <span id="player-current-time" class="font-mono">0:00</span>
                            <div class="w-32 bg-white/20 h-1 rounded-full overflow-hidden">
                                <div id="player-progress-bar" class="bg-gold-500 h-full w-0 transition-all"></div>
                            </div>
                            <span id="player-duration" class="font-mono">0:30</span>
                        </div>
                        <button onclick="shareSeries()" class="flex items-center space-x-1.5 bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-full backdrop-blur transition text-white text-xs">
                            <i class="fa-solid fa-share-nodes text-gold-400"></i>
                            <span>Поделиться</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. DESKTOP ADMIN PANEL DASHBOARD CONTAINER -->
        <div id="admin-container" class="hidden w-full max-w-7xl h-[calc(100vh-65px)] bg-dark-900 flex flex-col sm:flex-row overflow-hidden sm:rounded-2xl border border-dark-700/80 shadow-2xl">
            <!-- Admin Sidebar -->
            <aside class="w-full sm:w-64 bg-dark-800 border-r border-dark-700/80 p-4 flex flex-col justify-between shrink-0">
                <div class="space-y-6">
                    <div class="px-2">
                        <h2 class="text-xs font-bold uppercase tracking-wider text-gold-500">Панель Управления</h2>
                        <p class="text-[11px] text-gray-400 mt-0.5">Медиабиблиотека 9:16</p>
                    </div>

                    <nav class="space-y-1 text-xs font-semibold">
                        <button onclick="switchAdminTab('dashboard')" id="admin-nav-dashboard" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-gold-500 bg-gold-500/10 border border-gold-500/20 transition">
                            <i class="fa-solid fa-chart-pie w-5"></i>
                            <span>Дашборд</span>
                        </button>
                        <button onclick="switchAdminTab('series')" id="admin-nav-series" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-gray-400 hover:text-white hover:bg-dark-700/50 transition">
                            <i class="fa-solid fa-clapperboard w-5"></i>
                            <span>Сериалы и Серии</span>
                        </button>
                        <button onclick="switchAdminTab('categories')" id="admin-nav-categories" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-gray-400 hover:text-white hover:bg-dark-700/50 transition">
                            <i class="fa-solid fa-tags w-5"></i>
                            <span>Категории</span>
                        </button>
                    </nav>
                </div>

                <div class="pt-4 border-t border-dark-700 text-xs text-gray-500 flex items-center justify-between">
                    <span>Статус сервера: <span class="text-green-400 font-bold">Онлайн</span></span>
                    <i class="fa-solid fa-server text-green-400"></i>
                </div>
            </aside>

            <!-- Admin Content Viewport -->
            <section id="admin-content" class="flex-1 overflow-y-auto no-scrollbar p-6 bg-dark-900">
                <!-- Dynamically injected admin view -->
            </section>
        </div>

    </main>

    <!-- ADMIN MODAL: EDIT / ADD SERIES -->
    <div id="admin-series-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-dark-800 border border-dark-600 rounded-3xl w-full max-w-xl overflow-hidden shadow-2xl">
            <div class="px-6 py-4 border-b border-dark-700 flex justify-between items-center">
                <h3 id="series-modal-title" class="text-base font-bold text-white">Добавить сериал</h3>
                <button onclick="closeSeriesModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="series-form" onsubmit="saveSeries(event)" class="p-6 space-y-4 text-xs">
                <input type="hidden" id="edit-series-id">
                <div class="grid grid-cols-2 gap-3">
                    <div class="col-span-2">
                        <label class="block font-semibold text-gray-300 mb-1">Название сериала</label>
                        <input type="text" id="form-series-title" required class="w-full bg-dark-900 border border-dark-600 rounded-xl p-2.5 text-white focus:border-gold-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block font-semibold text-gray-300 mb-1">Жанр / Категория</label>
                        <select id="form-series-genre" required class="w-full bg-dark-900 border border-dark-600 rounded-xl p-2.5 text-white focus:border-gold-500 focus:outline-none">
                            <!-- Populated dynamically -->
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold text-gray-300 mb-1">Рейтинг (1.0 - 5.0)</label>
                        <input type="number" step="0.1" max="5" min="1" id="form-series-rating" required class="w-full bg-dark-900 border border-dark-600 rounded-xl p-2.5 text-white focus:border-gold-500 focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block font-semibold text-gray-300 mb-1">URL обложки (Формат 9:16)</label>
                    <input type="url" id="form-series-poster" required class="w-full bg-dark-900 border border-dark-600 rounded-xl p-2.5 text-white focus:border-gold-500 focus:outline-none" placeholder="https://images.unsplash.com/...">
                </div>
                <div>
                    <label class="block font-semibold text-gray-300 mb-1">Описание / Описание сюжета</label>
                    <textarea id="form-series-synopsis" rows="3" required class="w-full bg-dark-900 border border-dark-600 rounded-xl p-2.5 text-white focus:border-gold-500 focus:outline-none"></textarea>
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeSeriesModal()" class="px-4 py-2.5 rounded-xl bg-dark-700 text-gray-300 hover:bg-dark-600 font-bold">Отмена</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl bg-gold-500 text-dark-900 font-bold hover:bg-gold-400">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ADMIN MODAL: MANAGE EPISODES -->
    <div id="admin-episodes-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-dark-800 border border-dark-600 rounded-3xl w-full max-w-2xl overflow-hidden shadow-2xl flex flex-col max-h-[85vh]">
            <div class="px-6 py-4 border-b border-dark-700 flex justify-between items-center shrink-0">
                <div>
                    <h3 id="episodes-modal-series-title" class="text-base font-bold text-white">Управление сериями</h3>
                    <p class="text-xs text-gold-400">Вертикальные эпизоды 9:16</p>
                </div>
                <button onclick="closeEpisodesModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <div class="p-6 overflow-y-auto no-scrollbar space-y-6">
                <!-- Add Episode Form -->
                <form onsubmit="addEpisodeToSeries(event)" class="bg-dark-900/80 p-4 rounded-2xl border border-gold-500/20 space-y-3 text-xs">
                    <h4 class="font-bold text-gold-400">Добавить новую серию</h4>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-gray-400 mb-1">Название серии</label>
                            <input type="text" id="form-ep-title" placeholder="Серия 1: Начало" required class="w-full bg-dark-800 border border-dark-600 rounded-xl p-2 text-white focus:border-gold-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-gray-400 mb-1">Длительность</label>
                            <input type="text" id="form-ep-duration" placeholder="2:15" required class="w-full bg-dark-800 border border-dark-600 rounded-xl p-2 text-white focus:border-gold-500 focus:outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1">URL видео (9:16 MP4)</label>
                        <input type="url" id="form-ep-url" placeholder="https://assets.mixkit.co/..." required class="w-full bg-dark-800 border border-dark-600 rounded-xl p-2 text-white focus:border-gold-500 focus:outline-none">
                    </div>
                    <button type="submit" class="w-full py-2 bg-gold-500 text-dark-900 font-bold rounded-xl hover:bg-gold-400">Добавить серию</button>
                </form>

                <!-- Existing Episodes List -->
                <div>
                    <h4 class="font-bold text-white text-xs mb-3">Существующие серии</h4>
                    <div id="episodes-list-container" class="space-y-2">
                        <!-- Populated dynamically -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // --- Database & LocalStorage Integration ---
        const DEFAULT_SERIES = [
            {
                id: 1,
                title: "Неоновый Город",
                genre: "Киберпанк",
                rating: 4.9,
                views: "1.2M",
                synopsis: "В футуристическом мегаполисе детектив под прикрытием расследует серию загадочных кибер-атак в ночных кварталах неоновых огней.",
                poster: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=600&auto=format&fit=crop",
                episodes: [
                    { id: 101, title: "Серия 1: Пробуждение", duration: "1:45", videoUrl: "https://assets.mixkit.co/videos/preview/mixkit-woman-running-in-front-of-neon-lights-42867-large.mp4" },
                    { id: 102, title: "Серия 2: Улицы в огне", duration: "2:10", videoUrl: "https://assets.mixkit.co/videos/preview/mixkit-neon-lights-tunnel-background-animation-31953-large.mp4" },
                    { id: 103, title: "Серия 3: След сети", duration: "1:55", videoUrl: "https://assets.mixkit.co/videos/preview/mixkit-woman-running-in-front-of-neon-lights-42867-large.mp4" }
                ]
            },
            {
                id: 2,
                title: "Империя Теней",
                genre: "Триллер",
                rating: 4.8,
                views: "850K",
                synopsis: "Элитный наемник получает контракт на защиту наследницы корпорации, но вскоре понимает, что за ними охотится вся синдикатная верхушка.",
                poster: "https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=600&auto=format&fit=crop",
                episodes: [
                    { id: 201, title: "Серия 1: Контракт", duration: "2:00", videoUrl: "https://assets.mixkit.co/videos/preview/mixkit-hands-holding-a-neon-light-stick-42870-large.mp4" }
                ]
            },
            {
                id: 3,
                title: "Хроники Времени",
                genre: "Фантастика",
                rating: 4.7,
                views: "920K",
                synopsis: "Ученый изобретает устройство для перемещения на несколько секунд назад, однако каждое использование меняет реальность необратимо.",
                poster: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=600&auto=format&fit=crop",
                episodes: [
                    { id: 301, title: "Серия 1: Квантовый сбой", duration: "2:15", videoUrl: "https://assets.mixkit.co/videos/preview/mixkit-digital-animation-of-screens-and-numbers-31934-large.mp4" }
                ]
            }
        ];

        const DEFAULT_CATEGORIES = ['Киберпанк', 'Триллер', 'Фантастика', 'Экшен', 'Детектив'];

        let seriesDB = JSON.parse(localStorage.getItem('cv_series_db') || JSON.stringify(DEFAULT_SERIES));
        let categoriesDB = JSON.parse(localStorage.getItem('cv_categories_db') || JSON.stringify(DEFAULT_CATEGORIES));

        let appState = {
            viewMode: 'app', // 'app' or 'admin'
            adminTab: 'dashboard', // 'dashboard', 'series', 'categories'
            currentTab: 'catalog',
            currentCategory: 'Все',
            searchQuery: '',
            favorites: JSON.parse(localStorage.getItem('cv_favorites') || '[1, 3]'),
            user: JSON.parse(localStorage.getItem('cv_user') || '{"name": "Александр", "email": "alex@cinevertical.ru", "isLoggedIn": true}'),
            activeSeries: null,
            activeEpisodeIndex: 0,
            editingSeriesId: null
        };

        let isRegisterMode = false;

        function saveDB() {
            localStorage.setItem('cv_series_db', JSON.stringify(seriesDB));
            localStorage.setItem('cv_categories_db', JSON.stringify(categoriesDB));
        }

        // --- Init & Video Time Listeners ---
        window.addEventListener('DOMContentLoaded', () => {
            renderCurrentView();
            
            const videoEl = document.getElementById('active-video-element');
            videoEl.addEventListener('timeupdate', () => {
                if(videoEl.duration) {
                    const percent = (videoEl.currentTime / videoEl.duration) * 100;
                    document.getElementById('player-progress-bar').style.width = percent + '%';
                    document.getElementById('player-current-time').textContent = formatTime(videoEl.currentTime);
                    document.getElementById('player-duration').textContent = formatTime(videoEl.duration);
                }
            });
        });

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${String(secs).padStart(2, '0')}`;
        }

        function showToast(text) {
            const toast = document.getElementById('toast-box');
            document.getElementById('toast-text').textContent = text;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2000);
        }

        // --- View Mode Switcher (Mobile App vs Admin Panel) ---
        function togglePlatformView(mode) {
            appState.viewMode = mode;
            const appContainer = document.getElementById('app-container');
            const adminContainer = document.getElementById('admin-container');
            const appBtn = document.getElementById('view-mode-app-btn');
            const adminBtn = document.getElementById('view-mode-admin-btn');

            if (mode === 'admin') {
                appContainer.classList.add('hidden');
                adminContainer.classList.remove('hidden');
                adminBtn.className = "px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-2 bg-gold-500 text-dark-900 shadow-md";
                appBtn.className = "px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-2 text-gray-400 hover:text-white";
                renderAdminView();
            } else {
                adminContainer.classList.add('hidden');
                appContainer.classList.remove('hidden');
                appBtn.className = "px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-2 bg-gold-500 text-dark-900 shadow-md";
                adminBtn.className = "px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-2 text-gray-400 hover:text-white";
                renderCurrentView();
            }
        }

        // --- Navigation Router ---
        function switchTab(tabName) {
            appState.currentTab = tabName;
            
            ['catalog', 'search', 'favorites', 'profile'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (btn) {
                    if (t === tabName) {
                        btn.classList.remove('text-gray-400');
                        btn.classList.add('text-gold-500');
                    } else {
                        btn.classList.add('text-gray-400');
                        btn.classList.remove('text-gold-500');
                    }
                }
            });

            renderCurrentView();
        }

        function renderCurrentView() {
            const container = document.getElementById('view-content');
            container.scrollTop = 0;
            
            if (appState.currentTab === 'catalog') {
                container.innerHTML = renderCatalogView();
            } else if (appState.currentTab === 'search') {
                container.innerHTML = renderSearchView();
            } else if (appState.currentTab === 'favorites') {
                container.innerHTML = renderFavoritesView();
            } else if (appState.currentTab === 'profile') {
                container.innerHTML = renderProfileView();
            } else if (appState.currentTab === 'details') {
                container.innerHTML = renderDetailsView();
            } else if (appState.currentTab === 'auth') {
                container.innerHTML = renderAuthView();
            }
        }

        // --- Mobile App Views ---
        function renderCatalogView() {
            const categories = ['Все', ...categoriesDB];
            
            const filteredSeries = appState.currentCategory === 'All' || appState.currentCategory === 'Все'
                ? seriesDB
                : seriesDB.filter(s => s.genre === appState.currentCategory);

            const heroSeries = seriesDB[0] || {
                id: 0, title: "Нет данных", genre: "-", rating: 0, views: "0", synopsis: "", poster: "", episodes: []
            };

            return `
                <div class="px-5 pt-4 pb-2 flex justify-between items-center shrink-0">
                    <div>
                        <span class="text-xs font-semibold tracking-wider text-gold-500 uppercase">Кинотеатр 9:16</span>
                        <h1 class="text-xl font-bold text-white">Рекомендуемые</h1>
                    </div>
                    <button onclick="switchTab('search')" class="w-10 h-10 rounded-full bg-dark-700/80 border border-dark-600 flex items-center justify-center text-gray-300 hover:text-gold-400 transition">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>

                ${seriesDB.length > 0 ? `
                    <div class="px-5 py-3">
                        <div onclick="openDetails(${heroSeries.id})" class="relative rounded-3xl overflow-hidden aspect-[9/13] shadow-2xl group cursor-pointer border border-gold-500/20">
                            <img src="${heroSeries.poster}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" alt="${heroSeries.title}">

            return `

                                        <img src="${item.poster}" class="w-full h-full object-cover" alt="${item.title}">

                                        <div class="flex items-center space-x-2">

        function handleSearchInput(val) {
            appState.searchQuery = val;
            const container = document.getElementById('view-content');
            const scrollPos = container.scrollTop;
            container.innerHTML = renderSearchView();
            container.scrollTop = scrollPos;
            const input = document.getElementById('search-input');
            input.focus();
            input.setSelectionRange(input.value.length, input.value.length);
        }

        function clearSearch() {
            appState.searchQuery = '';
            renderCurrentView();
        }

            const series = seriesDB.find(s => s.id === seriesId);
            if (!series) return;
            appState.activeSeries = series;
            appState.currentTab = 'details';
            renderCurrentView();
        }

                    </button>

                    </button>
                </div>

                <div class="relative w-full aspect-[9/11] bg-dark-800">
                    <img src="${series.poster}" class="w-full h-full object-cover" alt="${series.title}">
                    <div class="absolute inset-0 bg-gradient-to-t from-dark-900 via-dark-900/30 to-transparent"></div>
                    
                    <div class="absolute bottom-4 left-5 right-5">
                        <div class="flex items-center space-x-2 mb-1">
                            <span class="bg-gold-500 text-dark-900 text-xs font-bold px-2.5 py-0.5 rounded-full">${series.genre}</span>

                    </div>

                    ${series.episodes.length > 0 ? `
                        <button onclick="playEpisode(${series.id}, 0)" class="w-full py-3 bg-dark-700/80 hover:bg-dark-600 border border-gold-500/30 rounded-2xl flex items-center justify-center space-x-2 text-gold-400 text-xs font-bold transition">
                            <i class="fa-solid fa-play text-sm"></i>

                        ${series.episodes.length === 0 ? `

                            <div class="grid grid-cols-4 gap-2.5">
                                ${series.episodes.map((ep, idx) => `
                                    <button onclick="playEpisode(${series.id}, ${idx})" class="aspect-square bg-dark-800 hover:bg-gold-500 hover:text-dark-900 border border-dark-700 rounded-2xl flex flex-col items-center justify-center transition group">

                        `}

        function toggleFavorite(seriesId) {
            const index = appState.favorites.indexOf(seriesId);
            if (index > -1) {
                appState.favorites.splice(index, 1);
                showToast('Удалено из избранного');
            } else {
                appState.favorites.push(seriesId);
                showToast('Добавлено в избранное');
            }
            localStorage.setItem('cv_favorites', JSON.stringify(appState.favorites));
            renderCurrentView();
        }

        function playEpisode(seriesId, episodeIndex) {
            const series = seriesDB.find(s => s.id === seriesId);
            if (!series || !series.episodes[episodeIndex]) return;
            
            appState.activeSeries = series;
            appState.activeEpisodeIndex = episodeIndex;

            const episode = series.episodes[episodeIndex];

            document.getElementById('player-series-title').textContent = series.title;
            document.getElementById('player-episode-subtitle').textContent = episode.title;
            
            const videoEl = document.getElementById('active-video-element');
            videoEl.src = episode.videoUrl;
            videoEl.play().catch(e => console.log("Autoplay prevented:", e));

            const strip = document.getElementById('player-episodes-strip');
            strip.innerHTML = series.episodes.map((ep, idx) => `
                <button onclick="switchPlayerEpisode(${idx})" class="px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition ${idx === episodeIndex ? 'bg-gold-500 text-dark-900 shadow-md' : 'bg-white/10 text-white hover:bg-white/20'}">
                    Серия ${idx + 1}
                </button>
            `).join('');

            updatePlayerLikeButton();
            document.getElementById('video-player-modal').classList.remove('hidden');
        }

        function switchPlayerEpisode(idx) {
            appState.activeEpisodeIndex = idx;
            playEpisode(appState.activeSeries.id, idx);
        }

        function closeVideoPlayer() {
            const videoEl = document.getElementById('active-video-element');
            videoEl.pause();
            document.getElementById('video-player-modal').classList.add('hidden');
        }

        function togglePlayerLike() {
            if (!appState.activeSeries) return;
            toggleFavorite(appState.activeSeries.id);
            updatePlayerLikeButton();
        }

        function updatePlayerLikeButton() {
            if (!appState.activeSeries) return;
            const isFav = appState.favorites.includes(appState.activeSeries.id);
            const icon = document.getElementById('player-like-icon');
            if (icon) {
                icon.className = isFav ? 'fa-solid fa-bookmark text-gold-500' : 'fa-regular fa-bookmark text-gold-400';
            }
        }

        function togglePlayPause() {
            const videoEl = document.getElementById('active-video-element');
            const indicator = document.getElementById('play-pause-indicator');
            const icon = document.getElementById('play-pause-icon');

            if (videoEl.paused) {
                videoEl.play();
                icon.className = 'fa-solid fa-play';
            } else {
                videoEl.pause();
                icon.className = 'fa-solid fa-pause';
            }

            indicator.classList.remove('opacity-0');
            setTimeout(() => {
                indicator.classList.add('opacity-0');
            }, 500);
        }

        function shareSeries() {
            if (navigator.share && appState.activeSeries) {
                navigator.share({
                    title: appState.activeSeries.title,
                    text: `Смотрю сериал "${appState.activeSeries.title}" в CineVertical 9:16!`,
                    url: window.location.href
                }).catch(() => {});
            } else {
                showToast('Ссылка скопирована в буфер');
            }
        }

            const favoriteSeries = seriesDB.filter(s => appState.favorites.includes(s.id));

            return `

                    <h1 class="text-xl font-bold text-white mb-1">Избранное</h1>
                    <p class="text-xs text-gray-400">Ваши сохраненные вертикальные сериалы</p>
                </div>

                <div class="px-5 py-3">

                            <p class="text-gray-400 text-sm">В избранном пока ничего нет</p>
                            <button onclick="switchTab('catalog')" class="mt-4 px-5 py-2.5 bg-gold-500 text-dark-900 font-bold text-xs rounded-xl shadow-lg shadow-gold-500/20">
                                Перейти в каталог
                            </button>
                        </div>
                    ` : `
                        <div class="grid grid-cols-2 gap-3">
                            ${favoriteSeries.map(item => `
                                <div onclick="openDetails(${item.id})" class="bg-dark-800 rounded-2xl overflow-hidden border border-dark-700/85 group cursor-pointer flex flex-col hover:border-gold-500/40 transition">
                                    <div class="relative aspect-[9/13] overflow-hidden bg-dark-700">
                                        <img src="${item.poster}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="${item.title}">
                                        <div class="absolute inset-0 bg-gradient-to-t from-dark-900/90 via-transparent to-transparent"></div>
                                        <button onclick="event.stopPropagation(); toggleFavorite(${item.id})" class="absolute top-2.5 right-2.5 w-8 h-8 rounded-full bg-black/60 backdrop-blur flex items-center justify-center text-gold-400 border border-gold-500/30">
                                            <i class="fa-solid fa-bookmark text-xs"></i>
                                        </button>
                                        <div class="absolute bottom-2.5 left-2.5 right-2.5">
                                            <span class="text-[10px] text-gold-400 font-medium">${item.genre}</span>
                                            <h3 class="text-sm font-bold text-white line-clamp-1">${item.title}</h3>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `}
                </div>
            `;
        }

        function renderProfileView() {
            if (!appState.user.isLoggedIn) {
                return renderAuthView();
            }

            return `
                <div class="px-5 pt-4 pb-2">
                    <h1 class="text-xl font-bold text-white mb-1">Профиль</h1>
                    <p class="text-xs text-gray-400">Управление учетной записью</p>
                </div>

                <div class="px-5 py-3 space-y-4">
                    <div class="glass-panel p-5 rounded-3xl flex items-center space-x-4 border border-gold-500/20">
                        <div class="w-16 h-16 rounded-full bg-gradient-to-br from-gold-500 to-bronze-500 flex items-center justify-center text-dark-900 font-black text-2xl shadow-lg">
                            ${appState.user.name.charAt(0)}
                        </div>
                        <div>
                            <h2 class="text-base font-bold text-white">${appState.user.name}</h2>
                            <p class="text-xs text-gray-400">${appState.user.email}</p>
                            <span class="inline-block mt-1.5 px-2.5 py-0.5 bg-gold-500/10 text-gold-400 text-[10px] font-bold rounded-full border border-gold-500/20">VIP Подписка активна</span>
                        </div>
                    </div>

                    <div class="bg-dark-800 rounded-2xl border border-dark-700/80 overflow-hidden divide-y divide-dark-700/60 text-xs">
                        <div onclick="showToast('Раздел истории просмотров')" class="p-4 flex items-center justify-between cursor-pointer hover:bg-dark-700/50 transition">
                            <div class="flex items-center space-x-3 text-gray-200">
                                <i class="fa-solid fa-clock-rotate-left text-gold-500 text-sm"></i>
                                <span class="font-medium">История просмотров</span>

                            <i class="fa-solid fa-chevron-right text-gray-500"></i>
                        </div>

                            <div class="flex items-center space-x-3 text-gray-200">
                                <i class="fa-solid fa-sliders text-gold-500 text-sm"></i>
                                <span class="font-medium">Качество воспроизведения</span>
                            </div>
                            <i class="fa-solid fa-chevron-right text-gray-500"></i>
                        </div>
                        <div onclick="showToast('Служба поддержки подключена')" class="p-4 flex items-center justify-between cursor-pointer hover:bg-dark-700/50 transition">
                            <div class="flex items-center space-x-3 text-gray-200">
                                <i class="fa-solid fa-headset text-gold-500 text-sm"></i>
                                <span class="font-medium">Поддержка 24/7</span>
                            </div>
                            <i class="fa-solid fa-chevron-right text-gray-500"></i>
                        </div>
                    </div>

                    <button onclick="logoutUser()" class="w-full py-3 bg-red-500/10 hover:bg-red-500/20 border border-red-500/30 text-red-400 font-bold rounded-2xl text-xs flex items-center justify-center space-x-2 transition">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i>
                        <span>Выйти из аккаунта</span>
                    </button>
                </div>
            `;

        function renderAuthView() {
            return `
                <div class="px-5 pt-8 pb-4 flex flex-col items-center text-center">
                    <div class="w-16 h-16 rounded-3xl bg-gradient-to-tr from-gold-500 to-bronze-500 flex items-center justify-center text-dark-900 text-2xl font-black mb-4 shadow-xl shadow-gold-500/20">
                        9:16
                    </div>
                    <h1 class="text-xl font-bold text-white mb-1" id="auth-title">${isRegisterMode ? 'Создать аккаунт' : 'Вход в CineVertical'}</h1>
                    <p class="text-xs text-gray-400">Стриминговый кинотеатр вертикальных сериалов</p>
                </div>

                <div class="px-5 py-2 space-y-3">
                    ${isRegisterMode ? `
                        <div>
                            <label class="block text-[11px] font-semibold text-gray-400 mb-1">Имя</label>
                            <input type="text" id="auth-name" placeholder="Александр" class="w-full bg-dark-800 border border-dark-600 rounded-2xl p-3 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-gold-500">
                        </div>
                    ` : ''}
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-400 mb-1">Email</label>
                        <input type="email" id="auth-email" placeholder="name@example.com" class="w-full bg-dark-800 border border-dark-600 rounded-2xl p-3 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-gold-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-400 mb-1">Пароль</label>
                        <input type="password" id="auth-password" placeholder="••••••••" class="w-full bg-dark-800 border border-dark-600 rounded-2xl p-3 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-gold-500">
                    </div>

                    <button onclick="handleAuthSubmit()" class="w-full mt-2 py-3 bg-gradient-to-r from-gold-500 to-bronze-500 text-dark-900 font-bold rounded-2xl text-xs shadow-lg shadow-gold-500/20 transition">
                        ${isRegisterMode ? 'Зарегистрироваться' : 'Войти'}
                    </button>

                    <div class="text-center pt-2">
                        <button onclick="toggleAuthMode()" class="text-xs text-gold-400 hover:underline">
                            ${isRegisterMode ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Зарегистрироваться'}
                        </button>
                    </div>
                </div>
            `;
        }

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            renderCurrentView();
        }

        function handleAuthSubmit() {
            const email = document.getElementById('auth-email').value;
            const nameInput = isRegisterMode ? document.getElementById('auth-name').value : 'Пользователь';
            
            if (!email) {
                showToast('Введите email');
                return;
            }

            appState.user = {
                name: nameInput || 'Киноман',
                email: email,
                isLoggedIn: true
            };
            localStorage.setItem('cv_user', JSON.stringify(appState.user));
            showToast(isRegisterMode ? 'Регистрация успешна!' : 'Успешный вход!');
            switchTab('profile');
        }

        function logoutUser() {
            appState.user = { isLoggedIn: false };
            localStorage.removeItem('cv_user');
            showToast('Выход выполнен');
            renderCurrentView();
        }

        // --- Admin Panel Logic ---
        function switchAdminTab(tab) {
            appState.adminTab = tab;
            ['dashboard', 'series', 'categories'].forEach(t => {
                const btn = document.getElementById(`admin-nav-${t}`);
                if (btn) {
                    if (t === tab) {
                        btn.className = "w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-gold-500 bg-gold-500/10 border border-gold-500/20 transition font-bold";
                    } else {
                        btn.className = "w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-gray-400 hover:text-white hover:bg-dark-700/50 transition font-medium";
                    }
                }
            });
            renderAdminView();
        }

        function renderAdminView() {
            const container = document.getElementById('admin-content');
            if (appState.adminTab === 'dashboard') {
                container.innerHTML = renderAdminDashboard();
            } else if (appState.adminTab === 'series') {
                container.innerHTML = renderAdminSeriesView();
            } else if (appState.adminTab === 'categories') {
                container.innerHTML = renderAdminCategoriesView();
            }
        }

        function renderAdminDashboard() {
            const totalEpisodes = seriesDB.reduce((acc, s) => acc + s.episodes.length, 0);

            return `
                <div class="space-y-6">
                    <div>
                        <h1 class="text-2xl font-bold text-white">Обзор системы</h1>
                        <p class="text-xs text-gray-400">Статистика и аналитика вашей медиаплатформы</p>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
                        <div class="bg-dark-800 p-5 rounded-2xl border border-dark-700 flex items-center justify-between">
                            <div>
                                <span class="text-xs text-gray-400">Всего сериалов</span>
                                <h3 class="text-2xl font-black text-white mt-1">${seriesDB.length}</h3>
                            </div>
                            <div class="w-12 h-12 rounded-2xl bg-gold-500/10 text-gold-400 border border-gold-500/20 flex items-center justify-center text-xl">
                                <i class="fa-solid fa-clapperboard"></i>
                            </div>
                        </div>
                        <div class="bg-dark-800 p-5 rounded-2xl border border-dark-700 flex items-center justify-between">
                            <div>
                                <span class="text-xs text-gray-400">Всего серий (9:16)</span>
                                <h3 class="text-2xl font-black text-white mt-1">${totalEpisodes}</h3>
                            </div>
                            <div class="w-12 h-12 rounded-2xl bg-bronze-500/10 text-bronze-500 border border-bronze-500/20 flex items-center justify-center text-xl">
                                <i class="fa-solid fa-film"></i>
                            </div>
                        </div>
                        <div class="bg-dark-800 p-5 rounded-2xl border border-dark-700 flex items-center justify-between">
                            <div>
                                <span class="text-xs text-gray-400">Категорий</span>
                                <h3 class="text-2xl font-black text-white mt-1">${categoriesDB.length}</h3>
                            </div>
                            <div class="w-12 h-12 rounded-2xl bg-blue-500/10 text-blue-400 border border-blue-500/20 flex items-center justify-center text-xl">
                                <i class="fa-solid fa-tags"></i>
                            </div>
                        </div>
                        <div class="bg-dark-800 p-5 rounded-2xl border border-dark-700 flex items-center justify-between">
                            <div>
                                <span class="text-xs text-gray-400">Просмотров</span>
                                <h3 class="text-2xl font-black text-white mt-1">4.7M</h3>
                            </div>
                            <div class="w-12 h-12 rounded-2xl bg-green-500/10 text-green-400 border border-green-500/20 flex items-center justify-center text-xl">
                                <i class="fa-solid fa-eye"></i>
                            </div>
                        </div>
                    </div>

                    <div class="bg-dark-800 p-5 rounded-2xl border border-dark-700">
                        <h3 class="text-sm font-bold text-white mb-4">Быстрый список контента</h3>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs text-gray-300">
                                <thead class="bg-dark-900/60 uppercase text-gray-400 text-[10px]">
                                    <tr>
                                        <th class="p-3">Сериал</th>
                                        <th class="p-3">Жанр</th>
                                        <th class="p-3">Рейтинг</th>
                                        <th class="p-3">Серий</th>
                                        <th class="p-3">Действия</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-dark-700/60">
                                    ${seriesDB.map(s => `
                                        <tr>
                                            <td class="p-3 font-bold text-white flex items-center space-x-3">
                                                <img src="${s.poster}" class="w-8 h-10 rounded-lg object-cover">
                                                <span>${s.title}</span>
                                            </td>
                                            <td class="p-3">${s.genre}</td>
                                            <td class="p-3 text-gold-400 font-bold"><i class="fa-solid fa-star text-[10px] mr-1"></i>${s.rating}</td>
                                            <td class="p-3">${s.episodes.length}</td>
                                            <td class="p-3">
                                                <button onclick="switchAdminTab('series')" class="text-gold-400 hover:underline">Управлять</button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderAdminSeriesView() {
            return `
                <div class="space-y-6">
                    <div class="flex justify-between items-center">
                        <div>
                            <h1 class="text-2xl font-bold text-white">Управление сериалами</h1>
                            <p class="text-xs text-gray-400">Добавление и редактирование вертикального видеоконтента</p>
                        </div>
                        <button onclick="openSeriesModal()" class="px-4 py-2.5 bg-gold-500 hover:bg-gold-400 text-dark-900 font-bold text-xs rounded-xl shadow-lg flex items-center space-x-2">
                            <i class="fa-solid fa-plus"></i>
                            <span>Добавить сериал</span>
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        ${seriesDB.map(s => `
                            <div class="bg-dark-800 border border-dark-700 rounded-2xl overflow-hidden flex flex-col justify-between">
                                <div class="p-4 flex space-x-3">
                                    <img src="${s.poster}" class="w-20 h-28 object-cover rounded-xl shrink-0">
                                    <div class="flex-1 min-w-0 space-y-1">
                                        <span class="text-[10px] bg-gold-500/10 text-gold-400 px-2 py-0.5 rounded-full border border-gold-500/20 font-bold">${s.genre}</span>
                                        <h3 class="text-sm font-bold text-white truncate">${s.title}</h3>
                                        <p class="text-xs text-gray-400 line-clamp-2">${s.synopsis}</p>
                                        <div class="text-xs text-gray-400 pt-1">
                                            <span class="text-gold-400 font-bold"><i class="fa-solid fa-star text-[10px]"></i> ${s.rating}</span>
                                            <span class="mx-1">•</span>
                                            <span>${s.episodes.length} серий</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="bg-dark-900/60 p-3 border-t border-dark-700 flex justify-between items-center text-xs">
                                    <button onclick="openEpisodesModal(${s.id})" class="text-gold-400 font-bold hover:underline flex items-center space-x-1">
                                        <i class="fa-solid fa-list-check"></i>
                                        <span>Серии (${s.episodes.length})</span>
                                    </button>
                                    <div class="flex space-x-2">
                                        <button onclick="openSeriesModal(${s.id})" class="w-8 h-8 rounded-lg bg-dark-700 text-gray-300 hover:text-white flex items-center justify-center">
                                            <i class="fa-solid fa-pen"></i>
                                        </button>
                                        <button onclick="deleteSeries(${s.id})" class="w-8 h-8 rounded-lg bg-red-500/10 text-red-400 hover:bg-red-500/20 flex items-center justify-center">
                                            <i class="fa-solid fa-trash"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderAdminCategoriesView() {
            return `
                <div class="space-y-6 max-w-2xl">
                    <div>
                        <h1 class="text-2xl font-bold text-white">Категории и Рубрики</h1>
                        <p class="text-xs text-gray-400">Управление жанрами для фильтрации в мобильном приложении</p>
                    </div>

                    <form onsubmit="addCategory(event)" class="flex space-x-2">
                        <input type="text" id="new-category-input" placeholder="Название новой категории..." required class="flex-1 bg-dark-800 border border-dark-600 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-gold-500">
                        <button type="submit" class="px-5 py-2.5 bg-gold-500 hover:bg-gold-400 text-dark-900 font-bold text-xs rounded-xl">Добавить</button>
                    </form>

                    <div class="bg-dark-800 rounded-2xl border border-dark-700 overflow-hidden divide-y divide-dark-700/60">
                        ${categoriesDB.map(cat => `
                            <div class="p-4 flex justify-between items-center text-xs">
                                <span class="font-bold text-white">${cat}</span>
                                <button onclick="deleteCategory('${cat}')" class="text-red-400 hover:text-red-300 font-semibold flex items-center space-x-1">
                                    <i class="fa-solid fa-trash-can"></i>
                                    <span>Удалить</span>
                                </button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // --- Admin Actions (CRUD) ---
        function openSeriesModal(seriesId = null) {
            appState.editingSeriesId = seriesId;
            const modal = document.getElementById('admin-series-modal');
            const titleEl = document.getElementById('series-modal-title');
            const genreSelect = document.getElementById('form-series-genre');

            genreSelect.innerHTML = categoriesDB.map(c => `<option value="${c}">${c}</option>`).join('');

            if (seriesId) {
                const s = seriesDB.find(item => item.id === seriesId);
                titleEl.textContent = 'Редактировать сериал';
                document.getElementById('edit-series-id').value = s.id;
                document.getElementById('form-series-title').value = s.title;
                document.getElementById('form-series-genre').value = s.genre;
                document.getElementById('form-series-rating').value = s.rating;
                document.getElementById('form-series-poster').value = s.poster;
                document.getElementById('form-series-synopsis').value = s.synopsis;
            } else {
                titleEl.textContent = 'Добавить сериал';
                document.getElementById('series-form').reset();
                document.getElementById('edit-series-id').value = '';
            }

            modal.classList.remove('hidden');
        }

        function closeSeriesModal() {
            document.getElementById('admin-series-modal').classList.add('hidden');
        }

        function saveSeries(e) {
            e.preventDefault();
            const id = document.getElementById('edit-series-id').value;
            const title = document.getElementById('form-series-title').value;
            const genre = document.getElementById('form-series-genre').value;
            const rating = parseFloat(document.getElementById('form-series-rating').value);
            const poster = document.getElementById('form-series-poster').value;
            const synopsis = document.getElementById('form-series-synopsis').value;

            if (id) {
                const s = seriesDB.find(item => item.id == id);
                if (s) {
                    s.title = title;
                    s.genre = genre;
                    s.rating = rating;
                    s.poster = poster;
                    s.synopsis = synopsis;
                }
            } else {
                const newSeries = {
                    id: Date.now(),
                    title,
                    genre,
                    rating,
                    views: "1K",
                    poster,
                    synopsis,
                    episodes: [
                        { id: Date.now() + 1, title: "Серия 1", duration: "1:30", videoUrl: "https://assets.mixkit.co/videos/preview/mixkit-woman-running-in-front-of-neon-lights-42867-large.mp4" }
                    ]
                };
                seriesDB.unshift(newSeries);
            }

            saveDB();
            closeSeriesModal();
            renderAdminView();
            renderCurrentView();
            showToast('Сериал сохранен');
        }

        function deleteSeries(id) {
            seriesDB = seriesDB.filter(s => s.id !== id);
            saveDB();
            renderAdminView();
            renderCurrentView();
            showToast('Сериал удален');
        }

        function openEpisodesModal(seriesId) {
            appState.editingSeriesId = seriesId;
            const series = seriesDB.find(s => s.id === seriesId);
            if (!series) return;

            document.getElementById('episodes-modal-series-title').textContent = series.title;
            renderEpisodesList(series);
            document.getElementById('admin-episodes-modal').classList.remove('hidden');
        }

        function closeEpisodesModal() {
            document.getElementById('admin-episodes-modal').classList.add('hidden');
        }

        function renderEpisodesList(series) {
            const container = document.getElementById('episodes-list-container');
            container.innerHTML = series.episodes.map((ep, idx) => `
                <div class="flex items-center justify-between p-3 bg-dark-900 rounded-xl border border-dark-700 text-xs">
                    <div>
                        <h5 class="font-bold text-white">${ep.title}</h5>
                        <span class="text-gray-400 text-[10px]">Длительность: ${ep.duration}</span>
                    </div>
                    <button onclick="deleteEpisode(${series.id}, ${ep.id})" class="text-red-400 hover:text-red-300 font-bold text-xs">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            `).join('');
        }

        function addEpisodeToSeries(e) {
            e.preventDefault();
            const series = seriesDB.find(s => s.id === appState.editingSeriesId);
            if (!series) return;

            const title = document.getElementById('form-ep-title').value;
            const duration = document.getElementById('form-ep-duration').value;
            const videoUrl = document.getElementById('form-ep-url').value;

            series.episodes.push({
                id: Date.now(),
                title,
                duration,
                videoUrl
            });

            saveDB();
            renderEpisodesList(series);
            renderAdminView();
            renderCurrentView();
            document.getElementById('form-ep-title').value = '';
            document.getElementById('form-ep-duration').value = '';
            document.getElementById('form-ep-url').value = '';
            showToast('Серия добавлена');
        }

        function deleteEpisode(seriesId, epId) {
            const series = seriesDB.find(s => s.id === seriesId);
            if (!series) return;
            series.episodes = series.episodes.filter(ep => ep.id !== epId);
            saveDB();
            renderEpisodesList(series);
            renderAdminView();
            renderCurrentView();
            showToast('Серия удалена');
        }

        function addCategory(e) {
            e.preventDefault();
            const input = document.getElementById('new-category-input');
            const val = input.value.trim();
            if (val && !categoriesDB.includes(val)) {
                categoriesDB.push(val);
                saveDB();
                input.value = '';
                renderAdminView();
                renderCurrentView();
                showToast('Категория добавлена');
            }
        }

        function deleteCategory(cat) {
            categoriesDB = categoriesDB.filter(c => c !== cat);
            saveDB();
            renderAdminView();
            renderCurrentView();
            showToast('Категория удалена');
        }
    </script>
</body>
</html>
